<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17243a"><title>Premier Text Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe3;color:#17243a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#17243a;color:#fff;padding:24px 20px 20px;display:flex;gap:14px;align-items:center}.brand-icon{font-size:28px}.sub{font-size:11px;letter-spacing:2px;opacity:.8;margin-top:3px}h1{font-size:25px;margin:0}
main{max-width:560px;margin:auto;padding:18px}.photo-card,.card{background:#fff;border:1px solid #d8d1c2;border-radius:18px;box-shadow:0 3px 10px #0000000d}.photo-card{display:block;text-align:center;padding:27px 18px;margin-bottom:14px;cursor:pointer}.camera{font-size:42px}.photo-title{font-weight:800;font-size:21px}.photo-sub{font-size:13px;color:#657080;margin-top:5px}.card{padding:17px;margin-bottom:14px}.label{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#657080}.value{font-size:24px;font-weight:750;margin-top:6px}.time{font-size:18px;font-weight:700;margin-top:3px}.status{font-size:13px;margin-top:9px;color:#657080}.message{font-size:15px;line-height:1.55;margin-top:9px;white-space:pre-line}.send{width:100%;border:0;border-radius:16px;background:#3d7657;color:#fff;font-size:19px;font-weight:800;padding:18px}.send:disabled{background:#a7b3aa}.retry{width:100%;margin-top:10px;padding:13px;border:1px solid #bdb5a5;border-radius:13px;background:transparent;color:#17243a;font-weight:700}footer{text-align:center;padding:16px;color:#657080;font-size:12px;letter-spacing:1px}
</style></head><body>
<header><div class="brand-icon">✈</div><div><h1>Text Assistant</h1><div class="sub">PHOTO → TEXT → SEND</div></div></header>
<main>
<label class="photo-card" for="photoInput"><div class="camera">▣</div><div class="photo-title">TAKE PICTURE</div><div class="photo-sub">Photograph the NUMBER / TIME section of your schedule</div></label>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
<section class="card"><div class="label">READY TO SEND</div><div class="value" id="phone">—</div><div class="time" id="time">—</div><div class="status" id="status">Take a picture to begin.</div></section>
<section class="card"><div class="label">MESSAGE PREVIEW</div><div id="message" class="message">Your message will appear here.</div></section>
<button id="sendBtn" class="send" disabled>SEND TEXT</button><button id="retryBtn" class="retry" hidden>TAKE ANOTHER PICTURE</button>
</main><footer>Premier Services Group</footer>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const I=id=>document.getElementById(id),input=I('photoInput'),phoneEl=I('phone'),timeEl=I('time'),msgEl=I('message'),status=I('status'),send=I('sendBtn'),retry=I('retryBtn');
let phone='',time='',message='';
function norm(s){return(s||'').replace(/[–—−]/g,'-').replace(/\u00a0/g,' ').replace(/\r/g,'\n').replace(/[OoQ]/g,'0').replace(/[Il|]/g,'1');}
function phoneFind(s){
 s=norm(s);
 let m=s.match(/(?:\+?1[\s.-]?)?(?:\(\s*\d{3}\s*\)|\d{3})[\s.-]*\d{3}[\s.-]*\d{4}/);
 if(m){let d=m[0].replace(/\D/g,'');if(d.length===11&&d[0]=='1')d=d.slice(1);if(d.length===10)return d}
 for(const c of (s.match(/\d[\d\s().-]{8,}\d/g)||[])){let d=c.replace(/\D/g,'');if(d.length===11&&d[0]=='1')d=d.slice(1);if(d.length===10)return d}
 return '';
}
function timeFind(s){
 s=norm(s).replace(/(\d)\s*[:;]\s*(\d{2})/g,'$1:$2');
 let m=s.match(/\b(\d{1,2})\s*[:.]\s*(\d{2})\s*-\s*(\d{1,2})\s*[:.]\s*(\d{2})\b/);
 return m?`${m[1]}:${m[2]}–${m[3]}:${m[4]}`:'';
}
function makeMsg(t){let h=parseInt(t,10);return`Hello, this is Daniel with Premier Services Group, the flooring and backsplash installer for Lowe’s.

I should be arriving at your home to measure between ${t} tomorrow ${h<12?'morning':'afternoon'}.

Please confirm that this will work for you, and let me know how many areas you are wanting measured.

Thank you, and have a fantastic evening!`;}
function fmt(p){return`(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`;}
function variants(file){
 return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{
  let scale=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*scale),h=Math.round(im.naturalHeight*scale);
  let c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');x.drawImage(im,0,0,w,h);
  let d=x.getImageData(0,0,w,h).data;for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];g=g<150?Math.max(0,g-25):Math.min(255,g+25);d[i]=d[i+1]=d[i+2]=g}x.putImageData(new ImageData(d,w,h),0,0);
  let a=[c.toDataURL('image/jpeg',.95)];let cw=Math.round(w*.85),ch=Math.round(h*.70),cx=Math.max(0,(w-cw)/2),cy=Math.max(0,(h-ch)/2);
  let c2=document.createElement('canvas');c2.width=cw;c2.height=ch;c2.getContext('2d').drawImage(c,cx,cy,cw,ch,0,0,cw,ch);a.push(c2.toDataURL('image/jpeg',.95));resolve(a);
 };im.onerror=reject;im.src=URL.createObjectURL(file)});
}
async function run(file){
 send.disabled=true;retry.hidden=true;status.textContent='Preparing picture…';
 try{
  if(!window.Tesseract)throw Error('OCR not loaded');let vs=await variants(file),txt='';
  for(let i=0;i<vs.length;i++){status.textContent=`Reading the schedule… ${i+1} of ${vs.length}`;let r=await Tesseract.recognize(vs[i],'eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`Reading the schedule… ${Math.round((m.progress||0)*100)}%`}});txt+='\n'+r.data.text}
  phone=phoneFind(txt);time=timeFind(txt);phoneEl.textContent=phone?fmt(phone):'Phone number not found';timeEl.textContent=time||'Appointment time not found';
  if(phone&&time){message=makeMsg(time);msgEl.textContent=message;status.textContent='Ready — tap SEND TEXT.';send.disabled=false}
  else{msgEl.textContent='I could not read both fields. Try a closer, sharper picture of just the NUMBER / TIME box.';status.textContent='Try again.';retry.hidden=false}
 }catch(e){console.error(e);status.textContent='Could not process that photo. Try again.';retry.hidden=false}
}
input.onchange=()=>{if(input.files[0])run(input.files[0])};retry.onclick=()=>input.click();
send.onclick=()=>{if(phone&&message)location.href=`sms:${phone}?&body=${encodeURIComponent(message)}`};
</script></body></html>
